# New, separate services only. Do not apply this configuration to existing services.
# Requires existing non-production Firebase credentials; no secrets are stored here.
services:
  - type: web
    runtime: static
    name: woo-draft-qa-20260909
    repo: https://github.com/TheRichArcher/woo-combine-backend
    branch: codex/draft-readiness-20260909
    autoDeployTrigger: 'off'
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE
        value: https://woo-draft-qa-api-20260909.onrender.com/api
      - key: VITE_FIREBASE_PROJECT_ID
        value: tosh-woo-combine
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: tosh-woo-combine.firebaseapp.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
  - type: web
    runtime: python
    name: woo-draft-qa-api-20260909
    repo: https://github.com/TheRichArcher/woo-combine-backend
    branch: codex/draft-readiness-20260909
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/rehearsal_entry.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: REHEARSAL_FIREBASE_PROJECT
        value: tosh-woo-combine
      - key: GOOGLE_CLOUD_PROJECT
        value: tosh-woo-combine
      - key: FIREBASE_PROJECT_ID
        value: tosh-woo-combine
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://woo-draft-qa-20260909.onrender.com
      - key: ENABLE_ROLE_SIMPLE
        value: 'false'
      - key: DRAFT_PAYMENTS_ENABLED
        value: 'false'
